<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Metallic Cyan-Violet Primary Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="80%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Amber Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Glassmorphism Reflection -->
    <linearGradient id="glass-reflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corner & Subtle Border -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primary-grad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Outer Film Reel Ring / Lens Aperture Orbit -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#primary-grad)" stroke-width="12" stroke-dasharray="80 20 40 20" stroke-linecap="round" opacity="0.85" filter="url(#neon-glow)" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="10 15" opacity="0.5" />

  <!-- Majestic Elk Antlers (Stylized Geometric Wings/Horns) -->
  <!-- Left Antler Branches -->
  <path d="M 230 260 C 200 230 150 200 110 200 C 135 185 160 185 180 195 C 160 170 120 145 90 145 C 120 135 155 145 185 165 C 175 130 150 95 130 80 C 165 95 195 130 215 170 C 235 140 250 110 256 90" 
        fill="none" stroke="url(#primary-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />

  <!-- Right Antler Branches -->
  <path d="M 282 260 C 312 230 362 200 402 200 C 377 185 352 185 332 195 C 352 170 392 145 422 145 C 392 135 357 145 327 165 C 337 130 362 95 382 80 C 347 95 317 130 297 170 C 277 140 262 110 256 90" 
        fill="none" stroke="url(#primary-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />

  <!-- Central Crest / Geometric Elk Shield -->
  <polygon points="256,160 300,240 256,380 212,240" fill="url(#bg-grad)" stroke="url(#primary-grad)" stroke-width="6" opacity="0.9" />

  <!-- Glowing Play Button Core (Gold Highlight) -->
  <path d="M 236 215 L 296 256 L 236 297 Z" fill="url(#gold-grad)" filter="url(#gold-glow)" />

  <!-- Crown Star Accent -->
  <path d="M 256 60 L 262 76 L 278 78 L 265 89 L 270 105 L 256 95 L 242 105 L 247 89 L 234 78 L 250 76 Z" fill="url(#gold-grad)" filter="url(#gold-glow)" />

  <!-- Glassmorphism Top Overlay Flare -->
  <path d="M 0 128 C 0 57.28 57.28 0 128 0 L 384 0 C 454.72 0 512 57.28 512 128 L 512 180 C 300 240 100 220 0 140 Z" fill="url(#glass-reflect)" />
</svg>
